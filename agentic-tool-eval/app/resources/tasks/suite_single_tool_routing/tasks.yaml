# Suite: suite_single_tool_routing
# Tests whether an agent can select the correct single tool for a given request.
# 22 tasks covering calculator, search, knowledge_base, time, sqlite_query,
# and ambiguous-tool-selection scenarios.

- id: "str_001"
  suite_id: "suite_single_tool_routing"
  category: "agentic"
  prompt: "What is 2 + 3?"
  toolset_id: "basic"
  max_turns: 5
  max_tool_calls: 5
  expected_steps:
    - allowed_tools: ["calculator"]
      arg_constraints:
        - param_name: "expression"
          constraint_type: "exact"
          expected_value: "2 + 3"
  order_matters: true
  expected_final_answer: "5"
  scoring:
    tool_selection_weight: 1.0
    tool_args_weight: 0.5
    trajectory_weight: 0.5
    efficiency_weight: 0.3
    final_answer_weight: 1.0
    pass_threshold: 0.6

