# Suite: suite_robustness_and_failures
# Tests whether an agent can recover from injected tool failures.
# 20 tasks covering retry after single failure, fallback to alternative tools,
# recovery from multiple simultaneous failures, and timeout-like failures.
#
# Categories (5 tasks each):
#   rob_001-005: Primary tool fails on first call, expecting retry
#   rob_006-010: Tool fails, expecting fallback to alternative tool
#   rob_011-015: Multiple tools fail requiring creative recovery
#   rob_016-020: Timeout-like failures occur

# ---------------------------------------------------------------------------
# Theme 1: Primary tool fails on first call, agent should retry (rob_001-005)
# ---------------------------------------------------------------------------

- id: "rob_001"
  suite_id: "suite_robustness_and_failures"
  category: "agentic"
  prompt: "What is 144 divided by 12?"
  toolset_id: "basic"
  max_turns: 10
  max_tool_calls: 15
  expected_steps:
    - allowed_tools: ["calculator"]
      arg_constraints:
        - param_name: "expression"
          constraint_type: "regex"
          pattern: "144\\s*/\\s*12"
      description: "First call to calculator fails"
    - allowed_tools: ["calculator"]
      arg_constraints:
        - param_name: "expression"
          constraint_type: "regex"
          pattern: "144\\s*/\\s*12"
      description: "Retry calculator after failure"
  order_matters: true
  expected_final_answer: "12"
  failure_injection:
    - tool_name: "calculator"
      trigger_on_call: 1
      error_message: "Simulated tool failure: calculator service temporarily unavailable"
  scoring:
    tool_selection_weight: 0.5
    tool_args_weight: 0.3
    trajectory_weight: 0.5
    efficiency_weight: 0.2
    final_answer_weight: 0.5
    robustness_weight: 2.0
    pass_threshold: 0.4

