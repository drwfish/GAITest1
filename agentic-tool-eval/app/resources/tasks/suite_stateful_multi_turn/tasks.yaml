# Suite: suite_stateful_multi_turn
# Tests whether an agent can handle multi-turn conversations with a simulated
# user, including asking for missing information, incorporating follow-up
# clarifications, iterating on results based on feedback, and achieving
# progressive milestones. 20 tasks with user_simulator configurations.

# ---------------------------------------------------------------------------
# Theme 1: Agent needs to ask for missing info before proceeding (smt_001-005)
# ---------------------------------------------------------------------------

- id: "smt_001"
  suite_id: "suite_stateful_multi_turn"
  category: "agentic"
  prompt: "Calculate the monthly payment on my mortgage."
  toolset_id: "basic"
  max_turns: 10
  max_tool_calls: 15
  expected_steps:
    - allowed_tools: ["calculator"]
      arg_constraints:
        - param_name: "expression"
          constraint_type: "regex"
          pattern: "(?i).*320000.*0\\.00(4|5).*"
    - allowed_tools: ["calculator"]
      arg_constraints:
        - param_name: "expression"
          constraint_type: "regex"
          pattern: "(?i).*360.*"
  order_matters: false
  expected_final_answer: null
  user_simulator:
    rules:
      - trigger_pattern: "(?i)(loan|principal|amount|how much|price|borrow)"
        response: "The loan amount is $320,000."
      - trigger_pattern: "(?i)(interest|rate|APR)"
        response: "The annual interest rate is 5.5%."
      - trigger_pattern: "(?i)(term|years|duration|length|period)"
        response: "It's a 30-year mortgage."
    default_response: "I don't have that information."
  scoring:
    tool_selection_weight: 1.0
    tool_args_weight: 0.5
    trajectory_weight: 1.0
    efficiency_weight: 0.3
    final_answer_weight: 1.0
    pass_threshold: 0.5

