# ---------------------------------------------------------------------------
# Theme 3: Iterative search with user feedback and refinement (smt_011-015)
# ---------------------------------------------------------------------------

- id: "smt_011"
  suite_id: "suite_stateful_multi_turn"
  category: "agentic"
  prompt: "Help me find a good restaurant nearby for dinner tonight."
  toolset_id: "multi_tool"
  max_turns: 10
  max_tool_calls: 15
  expected_steps:
    - allowed_tools: ["search"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)restaurant.*(near|dinner|tonight|best)"
    - allowed_tools: ["search"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(Italian|pasta).*(restaurant|dining).*(downtown|open late|8pm)"
    - allowed_tools: ["search"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(Italian|pasta).*(restaurant|dining).*(vegetarian|vegan|plant-based|dietary)"
  order_matters: true
  expected_final_answer: null
  user_simulator:
    rules:
      - trigger_pattern: "(?i)(restaurant|option|suggestion|recommend|found|here are)"
        response: "Hmm, I should have mentioned - I'm looking for Italian food specifically, and it needs to be open past 8pm. Could you refine your search?"
      - trigger_pattern: "(?i)(Italian.*open|Italian.*8pm|Italian.*late|pasta|open.*Italian)"
        response: "Those look good! One more thing - my partner is vegetarian. Can you check which of these have good vegetarian options?"
      - trigger_pattern: "(?i)(vegetarian|vegan|plant-based|dietary)"
        response: "Perfect, I'll go with that one. Thanks!"
    default_response: "I don't have that information."
  scoring:
    tool_selection_weight: 1.0
    tool_args_weight: 0.5
    trajectory_weight: 1.0
    efficiency_weight: 0.3
    final_answer_weight: 1.0
    pass_threshold: 0.5

