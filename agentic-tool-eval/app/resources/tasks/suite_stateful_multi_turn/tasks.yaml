- id: "smt_006"
  suite_id: "suite_stateful_multi_turn"
  category: "agentic"
  prompt: "Search for recent news about renewable energy."
  toolset_id: "multi_tool"
  max_turns: 10
  max_tool_calls: 15
  expected_steps:
    - allowed_tools: ["search"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)renewable energy.*(news|recent|latest|2025|2026)"
    - allowed_tools: ["search"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(solar.*energy|solar.*farm).*(Europe|EU|European)"
    - allowed_tools: ["calculator"]
      arg_constraints:
        - param_name: "expression"
          constraint_type: "any"
  order_matters: true
  expected_final_answer: null
  user_simulator:
    rules:
      - trigger_pattern: "(?i)(found|here are|results|articles|news)"
        response: "Interesting, but I'm mostly interested in solar energy developments in Europe. Can you focus on that? Also, calculate the percentage growth if solar capacity went from 210 GW to 295 GW."
