# ---------------------------------------------------------------------------

- id: "smt_016"
  suite_id: "suite_stateful_multi_turn"
  category: "agentic"
  prompt: "Help me set up a new project budget. I need a full financial plan."
  toolset_id: "multi_tool"
  max_turns: 10
  max_tool_calls: 15
  expected_steps:
    - allowed_tools: ["sqlite_query"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)SELECT.*FROM.*(budgets|projects).*WHERE.*(similar|previous|past|comparable)"
    - allowed_tools: ["knowledge_base"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(budget|financial).*template|budget.*allocation.*guideline"
    - allowed_tools: ["calculator"]
      arg_constraints:
        - param_name: "expression"
          constraint_type: "regex"
          pattern: "(?i).*500000.*"
    - allowed_tools: ["search"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(industry|standard|best practice).*(project budget|cost allocation|contingency)"
  order_matters: false
  expected_final_answer: null
  user_simulator:
    rules:
      - trigger_pattern: "(?i)(what.*project|type|scope|detail|more info|tell me about)"
        response: "It's a 6-month software development project with a total budget of $500,000. We need to allocate across personnel, infrastructure, and contingency."
      - trigger_pattern: "(?i)(previous|historical|past|similar|reference|comparable)"
        response: "Yes, check the budgets table for similar past projects in the software category."
      - trigger_pattern: "(?i)(allocation|percentage|split|breakdown|how much.*each)"
        response: "Use the standard 60/25/15 split: 60% personnel, 25% infrastructure, 15% contingency."
      - trigger_pattern: "(?i)(industry|benchmark|standard|best practice)"
        response: "That comparison is very helpful, thank you."
    default_response: "I don't have that information."
  scoring:
    tool_selection_weight: 1.0
    tool_args_weight: 0.5
    trajectory_weight: 1.0
    efficiency_weight: 0.3
    final_answer_weight: 1.0
    pass_threshold: 0.5
  milestones:
    - description: "Gathered project parameters from user"
      required_tools: []
      required_information: ["budget amount", "project duration", "allocation categories"]
    - description: "Retrieved historical budget data"
      required_tools: ["sqlite_query"]
      required_information: ["past project budgets"]
    - description: "Looked up budget allocation guidelines"
      required_tools: ["knowledge_base"]
      required_information: ["allocation template or guidelines"]
    - description: "Calculated budget breakdown"
      required_tools: ["calculator"]
      required_information: ["personnel allocation", "infrastructure allocation", "contingency allocation"]
    - description: "Benchmarked against industry standards"
      required_tools: ["search"]
      required_information: ["industry comparison data"]

- id: "smt_017"
  suite_id: "suite_stateful_multi_turn"
  category: "agentic"
  prompt: "I need to analyze our website's performance issues and come up with a fix."
  toolset_id: "full"
  max_turns: 10
  max_tool_calls: 15
  expected_steps:
    - allowed_tools: ["file_read"]
      arg_constraints:
        - param_name: "path"
          constraint_type: "exact"
          expected_value: "/var/log/nginx/access.log"
    - allowed_tools: ["sqlite_query"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)SELECT.*FROM.*(metrics|performance|response_times).*WHERE.*(slow|threshold|avg|average)"
    - allowed_tools: ["slow_accurate"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(web.*performance|page.*load|server.*response).*(optimiz|diagnos|bottleneck)"
    - allowed_tools: ["search"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(nginx|web server).*(performance|optim|tun|speed).*(high traffic|concurrent)"
  order_matters: true
  expected_final_answer: null
  user_simulator:
    rules:
      - trigger_pattern: "(?i)(which|what).*(site|website|URL|domain|server|log)"
        response: "The web server logs are at /var/log/nginx/access.log and we track performance metrics in the database's metrics table."
      - trigger_pattern: "(?i)(log|access|error|metric|data|slow|latency|response time)"
        response: "It looks like the API endpoints are really slow. Can you do a thorough analysis of what might be causing the bottleneck? Use the accurate analysis tool for this."
      - trigger_pattern: "(?i)(bottleneck|analysis|cause|diagnos|root cause|accurate)"
        response: "That makes sense. Can you search for best practices on optimizing nginx for high-traffic sites so we can fix this?"
      - trigger_pattern: "(?i)(nginx|optimiz|best practice|fix|solution|recommend)"
        response: "Great analysis and recommendations. I'll implement these changes."
    default_response: "I don't have that information."
  scoring:
    tool_selection_weight: 1.0
    tool_args_weight: 0.5
    trajectory_weight: 1.0
    efficiency_weight: 0.3
    final_answer_weight: 1.0
    pass_threshold: 0.5
  milestones:
    - description: "Collected server logs and initial data"
      required_tools: ["file_read"]
      required_information: ["server log contents"]
    - description: "Queried performance metrics from database"
      required_tools: ["sqlite_query"]
      required_information: ["response times", "slow endpoints"]
    - description: "Performed thorough performance diagnosis"
      required_tools: ["slow_accurate"]
      required_information: ["root cause analysis"]
    - description: "Researched optimization strategies"
      required_tools: ["search"]
      required_information: ["performance best practices"]

- id: "smt_018"
  suite_id: "suite_stateful_multi_turn"
  category: "agentic"
  prompt: "I want to plan a company offsite event. Help me organize everything."
  toolset_id: "multi_tool"
  max_turns: 10
  max_tool_calls: 15
  expected_steps:
    - allowed_tools: ["sqlite_query"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)SELECT.*COUNT.*FROM.*employees"
    - allowed_tools: ["knowledge_base"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(company|corporate).*(event|offsite|retreat).*(policy|guideline|budget)"
    - allowed_tools: ["search"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(venue|event space|retreat).*(Austin|Texas).*(50|corporate|team).*2026"
    - allowed_tools: ["calculator"]
      arg_constraints:
        - param_name: "expression"
          constraint_type: "regex"
          pattern: "(?i).*50.*"
    - allowed_tools: ["search"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(team building|offsite|corporate).*(activit|agenda|itinerary)"
  order_matters: false
  expected_final_answer: null
  user_simulator:
    rules:
      - trigger_pattern: "(?i)(how many|attendees|people|team size|head count|number of)"
        response: "We have about 50 people attending. The event is in Austin, Texas in June 2026."
      - trigger_pattern: "(?i)(budget|cost|spend|policy|guideline)"
        response: "Check the knowledge base for our company's event policy. The budget is $30,000 total."
      - trigger_pattern: "(?i)(venue|location|space|place|hotel)"
        response: "Those venue options look good. Can you calculate the per-person cost if the venue is $15,000 and catering is $10,000?"
      - trigger_pattern: "(?i)(per.*person|\\$500|cost.*each|individual|per head|activity|agenda|itinerary)"
        response: "Can you also search for popular team building activities for corporate offsites?"
      - trigger_pattern: "(?i)(team building|activit)"
        response: "This is a solid plan. Thank you!"
    default_response: "I don't have that information."
  scoring:
    tool_selection_weight: 1.0
    tool_args_weight: 0.5
    trajectory_weight: 1.0
    efficiency_weight: 0.3
    final_answer_weight: 1.0
    pass_threshold: 0.5
  milestones:
    - description: "Determined attendee count and basic parameters"
      required_tools: ["sqlite_query"]
      required_information: ["employee count", "location", "date"]
    - description: "Retrieved company event policies"
      required_tools: ["knowledge_base"]
      required_information: ["event policy", "budget constraints"]
    - description: "Researched venue options"
      required_tools: ["search"]
      required_information: ["venue options in Austin"]
    - description: "Calculated per-person costs"
      required_tools: ["calculator"]
      required_information: ["per-person cost breakdown"]
    - description: "Found team building activities"
      required_tools: ["search"]
      required_information: ["activity suggestions"]

- id: "smt_019"
  suite_id: "suite_stateful_multi_turn"
  category: "agentic"
  prompt: "Help me create a competitive analysis report for our product."
  toolset_id: "full"
  max_turns: 10
  max_tool_calls: 15
  expected_steps:
    - allowed_tools: ["knowledge_base"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(product|our).*(feature|specification|detail|capability)"
    - allowed_tools: ["search"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(competitor|competing|rival|alternative).*(project management|PM).*(tool|software|platform)"
    - allowed_tools: ["sqlite_query"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)SELECT.*FROM.*(market_share|market_data|competitors)"
    - allowed_tools: ["slow_accurate"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(competitive|SWOT|strength|weakness|comparison|analysis).*(project management|PM)"
    - allowed_tools: ["calculator"]
      arg_constraints:
        - param_name: "expression"
          constraint_type: "regex"
          pattern: "(?i).*market.*share|.*percent.*"
  order_matters: false
  expected_final_answer: null
  user_simulator:
    rules:
      - trigger_pattern: "(?i)(which product|what product|product name|what.*analyz|industry|domain)"
        response: "Our product is a project management SaaS tool called TaskFlow. Main competitors are Asana, Monday.com, and Jira."
      - trigger_pattern: "(?i)(feature|specification|capability|TaskFlow)"
        response: "Good, you found our product details. Now search for the latest competitor features and pricing."
      - trigger_pattern: "(?i)(competitor|Asana|Monday|Jira|pricing|feature.*comparison)"
        response: "We also have market share data in our database in the market_share table. Can you pull that and calculate our relative market position?"
      - trigger_pattern: "(?i)(market share|market data|position|database)"
        response: "Now can you do a thorough SWOT analysis comparing us to the top competitor using the accurate analysis tool?"
      - trigger_pattern: "(?i)(SWOT|strength|weakness|opportunit|threat|analysis)"
        response: "Excellent report. This is exactly what I needed for the board meeting."
    default_response: "I don't have that information."
  scoring:
    tool_selection_weight: 1.0
    tool_args_weight: 0.5
    trajectory_weight: 1.0
    efficiency_weight: 0.3
    final_answer_weight: 1.0
    pass_threshold: 0.5
  milestones:
    - description: "Gathered own product information"
      required_tools: ["knowledge_base"]
      required_information: ["TaskFlow features and specifications"]
    - description: "Researched competitor landscape"
      required_tools: ["search"]
      required_information: ["competitor features", "competitor pricing"]
    - description: "Retrieved market share data"
      required_tools: ["sqlite_query"]
      required_information: ["market share percentages"]
    - description: "Calculated market position metrics"
      required_tools: ["calculator"]
      required_information: ["relative market position"]
    - description: "Completed SWOT analysis"
      required_tools: ["slow_accurate"]
      required_information: ["strengths", "weaknesses", "opportunities", "threats"]

- id: "smt_020"
  suite_id: "suite_stateful_multi_turn"
  category: "agentic"
  prompt: "I need to prepare a data migration plan from our old system to the new one."
  toolset_id: "full"
  max_turns: 10
  max_tool_calls: 15
  expected_steps:
    - allowed_tools: ["sqlite_query"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)SELECT.*(table|schema|column|COUNT|size).*FROM.*(information_schema|old_system|legacy)"
    - allowed_tools: ["file_read"]
      arg_constraints:
        - param_name: "path"
          constraint_type: "exact"
          expected_value: "/docs/new_system_schema.json"
    - allowed_tools: ["knowledge_base"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(data migration|migration).*(best practice|guideline|checklist|strategy)"
    - allowed_tools: ["slow_accurate"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(schema|field|column).*(mapping|transform|compatibility|mismatch)"
    - allowed_tools: ["calculator"]
      arg_constraints:
        - param_name: "expression"
          constraint_type: "regex"
          pattern: "(?i).*2000000.*|.*2.*10\\^6.*|.*migration.*time.*"
    - allowed_tools: ["search"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(data migration|database migration).*(tool|automat|script|ETL)"
  order_matters: false
  expected_final_answer: null
  user_simulator:
    rules:
      - trigger_pattern: "(?i)(which|what).*(system|database|platform|old|new|source|target)"
        response: "The old system is a PostgreSQL database and the new one uses MongoDB. The new system schema is documented at /docs/new_system_schema.json."
      - trigger_pattern: "(?i)(schema|table|structure|column|old.*system|legacy|how many|size|record)"
        response: "Query the old system database to get the table structure and record counts. We have about 2 million records total."
      - trigger_pattern: "(?i)(mapping|transform|field|compatib|mismatch|analysis)"
        response: "Good analysis. Can you check the knowledge base for our company's data migration guidelines and also estimate how long the migration would take at 500 records per second?"
      - trigger_pattern: "(?i)(guideline|best practice|time|hour|minute|duration|estimate|500)"
        response: "That timeline works. Can you also search for recommended ETL tools for PostgreSQL to MongoDB migrations?"
      - trigger_pattern: "(?i)(ETL|tool|automat|script|PostgreSQL.*MongoDB|migration tool)"
        response: "This is a comprehensive plan. Let's proceed with this approach."
    default_response: "I don't have that information."
  scoring:
    tool_selection_weight: 1.0
    tool_args_weight: 0.5
    trajectory_weight: 1.0
    efficiency_weight: 0.3
    final_answer_weight: 1.0
    pass_threshold: 0.5
  milestones:
    - description: "Assessed source database structure and size"
      required_tools: ["sqlite_query"]
      required_information: ["table schemas", "record counts"]
    - description: "Retrieved target system schema"
      required_tools: ["file_read"]
      required_information: ["new system schema definition"]
    - description: "Analyzed schema mapping and compatibility"
      required_tools: ["slow_accurate"]
      required_information: ["field mappings", "transformation requirements"]
    - description: "Reviewed migration guidelines and estimated timeline"
      required_tools: ["knowledge_base", "calculator"]
      required_information: ["migration best practices", "estimated duration"]
    - description: "Identified migration tooling"
      required_tools: ["search"]
      required_information: ["recommended ETL tools"]
