# Suite: suite_abstain_and_missing_tools
# Tests whether an agent correctly abstains from calling tools when no suitable
# tool is available. The agent should recognize the limitation and respond
# without making any tool calls.
#
# 20 tasks across four categories:
#   abs_001-abs_005: Empty toolset (no tools at all, various requests)
#   abs_006-abs_010: calculator_only toolset, but request needs search/KB/SQL
#   abs_011-abs_015: search_only toolset, but request needs calculator/SQL/KB
#   abs_016-abs_020: Any toolset, but the request itself needs no tool at all

# ---------------------------------------------------------------------------
# Category 1: Empty toolset -- no tools available at all
# ---------------------------------------------------------------------------

- id: "abs_001"
  suite_id: "suite_abstain_and_missing_tools"
  category: "agentic"
  prompt: "Calculate 1234 * 5678 for me."
  toolset_id: "empty"
  max_turns: 5
  max_tool_calls: 5
  expected_steps: []
  order_matters: true
  abstain_expected: true
  expected_final_answer: null
  scoring:
    tool_selection_weight: 0.0
    tool_args_weight: 0.0
    trajectory_weight: 0.0
    efficiency_weight: 0.0
    final_answer_weight: 0.5
    abstention_weight: 2.0
    pass_threshold: 0.5

