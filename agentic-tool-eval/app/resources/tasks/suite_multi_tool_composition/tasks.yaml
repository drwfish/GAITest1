# Suite: suite_multi_tool_composition
# Tests whether an agent can chain multiple tools in sequence to complete
# composite tasks. 22 tasks covering 2-6 step workflows across calculator,
# search, sqlite_query, knowledge_base, file_read, time, slow_accurate,
# and fast_approx tools.

# ---------------------------------------------------------------------------
# 2-step compositions
# ---------------------------------------------------------------------------

- id: "mtc_001"
  suite_id: "suite_multi_tool_composition"
  category: "agentic"
  prompt: "Search for the current price of gold per ounce, then calculate how much 15 ounces would cost."
  toolset_id: "multi_tool"
  max_turns: 10
  max_tool_calls: 15
  expected_steps:
    - allowed_tools: ["search"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)(price|cost).*gold.*ounce"
    - allowed_tools: ["calculator"]
      arg_constraints:
        - param_name: "expression"
          constraint_type: "regex"
          pattern: ".*15.*"
  order_matters: true
  expected_final_answer: null
  scoring:
    tool_selection_weight: 1.0
    tool_args_weight: 0.8
    trajectory_weight: 1.0
    efficiency_weight: 0.5
    final_answer_weight: 1.0
    pass_threshold: 0.5

