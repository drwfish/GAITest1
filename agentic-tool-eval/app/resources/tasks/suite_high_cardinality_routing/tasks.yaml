# ---------------------------------------------------------------------------
# Category 2: Tricky wording that might confuse keyword-based matching
# ---------------------------------------------------------------------------

- id: "hcr_006"
  suite_id: "suite_high_cardinality_routing"
  category: "agentic"
  prompt: "Calculate how many employees are in each department by querying the database."
  toolset_id: "full"
  max_turns: 5
  max_tool_calls: 5
  expected_steps:
    - allowed_tools: ["sqlite_query"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)SELECT.*COUNT.*FROM.*employees.*GROUP BY.*department"
  order_matters: true
  expected_final_answer: "query_results"
  scoring:
    tool_selection_weight: 1.5
    tool_args_weight: 0.5
    trajectory_weight: 0.5
    efficiency_weight: 0.3
    final_answer_weight: 0.8
    pass_threshold: 0.6
  description: >
    Simulates high cardinality (50-200 tools). The word 'calculate' is a strong
    keyword match for the calculator tool, but the actual request requires a
    SQL GROUP BY aggregation. Tests that the agent reads past the verb.

