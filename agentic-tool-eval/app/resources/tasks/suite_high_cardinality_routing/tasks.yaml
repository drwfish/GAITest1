# Suite: suite_high_cardinality_routing
# Tests tool selection when many tools are available (simulates 50-200 tools).
# Uses the "full" toolset (8 tools) as a proxy since we cannot register 200 tools
# in the registry. Each task is designed to stress-test routing logic that would
# break down when dozens of distractor tools share overlapping keywords.
# 20 tasks covering:
#   hcr_001-hcr_005: Ambiguous prompts where multiple tools could match but one is clearly best
#   hcr_006-hcr_010: Tricky wording that might confuse keyword-based matching
#   hcr_011-hcr_015: Obvious correct tool (baseline sanity checks)
#   hcr_016-hcr_020: Domain jargon that requires understanding tool descriptions

# ---------------------------------------------------------------------------
# Category 1: Ambiguous prompts -- multiple tools could match, one is best
# ---------------------------------------------------------------------------

- id: "hcr_001"
  suite_id: "suite_high_cardinality_routing"
  category: "agentic"
  prompt: "I need information about employee compensation. Can you look up how much people in Engineering are making?"
  toolset_id: "full"
  max_turns: 5
  max_tool_calls: 5
  expected_steps:
    - allowed_tools: ["sqlite_query"]
      arg_constraints:
        - param_name: "query"
          constraint_type: "regex"
          pattern: "(?i)SELECT.*FROM.*employees.*WHERE.*department.*Engineering"
  order_matters: true
  expected_final_answer: "query_results"
  scoring:
    tool_selection_weight: 1.5
    tool_args_weight: 0.5
    trajectory_weight: 0.5
    efficiency_weight: 0.3
    final_answer_weight: 0.8
    pass_threshold: 0.6
  description: >
    Simulates high cardinality (50-200 tools). Prompt mentions 'information' and
    'look up', which could match search or knowledge_base, but the request is
    about structured employee data that requires sqlite_query.

