# Clawdbot Configuration
# Documentation: https://docs.clawd.bot/start/getting-started

# ─── Gateway ───────────────────────────────────────────────────────
gateway:
  port: 18789
  host: 127.0.0.1

# ─── Agent (Claude) ────────────────────────────────────────────────
agent:
  provider: anthropic
  model: claude-sonnet-4-20250514
  # To use a different Claude model, uncomment one of these:
  # model: claude-opus-4-20250514
  # model: claude-haiku-235-20241022
  auth:
    # Option 1 (recommended): Anthropic API key set via ANTHROPIC_API_KEY env var
    # Option 2: Claude Code setup token — run `claude setup-token` and set
    #           CLAUDE_SETUP_TOKEN in your .env file
    method: env

# ─── Skills ────────────────────────────────────────────────────────
skills:
  - name: claude-connect
    enabled: true
    description: Keep Claude connection alive 24/7

  - name: claude-code-usage
    enabled: true
    description: Check Claude Code OAuth usage limits

  - name: web-search
    enabled: false
    # Requires BRAVE_SEARCH_API_KEY in .env to enable

# ─── Memory ────────────────────────────────────────────────────────
memory:
  enabled: true
  persist: true
  storage_path: ./clawdbot-data/memory
